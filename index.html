<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Deploy a site</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 12% 5%, rgb(207 225 255 / 72%), transparent 38%),
          radial-gradient(ellipse at 92% 92%, rgb(224 216 255 / 58%), transparent 34%), #f5f7fb;
      }

      main {
        width: min(100%, 520px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid #e5e9f1;
        border-radius: 24px;
        background: rgb(255 255 255 / 94%);
        box-shadow: 0 24px 72px rgb(30 45 80 / 10%);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #5b63d3;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 2.65rem);
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      .intro {
        margin: 14px 0 32px;
        color: #647087;
        font-size: 1rem;
        line-height: 1.65;
      }

      form {
        display: grid;
        gap: 22px;
      }

      label {
        display: grid;
        gap: 9px;
        font-size: 0.9rem;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 1px solid #d7ddea;
        border-radius: 11px;
        background: #fff;
        color: #172033;
        font: inherit;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      input:focus-visible {
        border-color: #696fe0;
        outline: none;
        box-shadow: 0 0 0 4px rgb(105 111 224 / 16%);
      }

      input[type="file"] {
        padding: 8px;
        color: #647087;
        font-size: 0.84rem;
      }

      input[type="file"]::file-selector-button {
        min-height: 32px;
        margin-right: 12px;
        padding: 0 12px;
        border: 0;
        border-radius: 7px;
        background: #edf0ff;
        color: #4b52bf;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      .hint {
        margin: -3px 0 0;
        color: #768198;
        font-size: 0.78rem;
        font-weight: 400;
        line-height: 1.5;
      }

      button {
        min-height: 52px;
        margin-top: 2px;
        border: 0;
        border-radius: 11px;
        background: #565ed0;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 150ms ease,
          transform 150ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        background: #454dbb;
      }

      button:focus-visible {
        outline: 3px solid rgb(86 94 208 / 28%);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        min-height: 1.5em;
        margin: 0;
        color: #647087;
        font-size: 0.9rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      #status[data-state="error"] {
        color: #b42336;
      }

      #status[data-state="success"] {
        color: #24734a;
      }

      #status a {
        color: inherit;
        font-weight: 700;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Static site hosting</p>
      <h1>Deploy your site</h1>
      <p class="intro">Choose a name and upload a gzip-compressed tar archive to publish your site.</p>

      <form id="deploy-form">
        <label for="site-name">
          Site name
          <input
            id="site-name"
            name="siteName"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="my-site"
            pattern="[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?"
            maxlength="63"
            required
          />
          <span class="hint">Use letters, numbers, and hyphens. Your site will be available at its subdomain.</span>
        </label>

        <label for="site-archive">
          Site archive
          <input id="site-archive" name="siteArchive" type="file" accept=".tar.gz,.tgz,application/gzip" required />
          <span class="hint">The archive should contain an index.html at its root.</span>
        </label>

        <button type="submit">Deploy site</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const form = document.querySelector("#deploy-form");
      const status = document.querySelector("#status");
      const submitButton = form.querySelector('button[type="submit"]');

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;

        const siteName = form.elements.siteName.value.trim();
        const archive = form.elements.siteArchive.files[0];
        status.dataset.state = "";
        status.textContent = "Uploading and deploying…";
        submitButton.disabled = true;

        try {
          const response = await fetch("/_ui/deploy", {
            method: "POST",
            headers: { "X-Deploy-Name": siteName },
            body: archive,
          });
          const body = await response.text();
          let result;

          try {
            result = JSON.parse(body);
          } catch {
            result = { error: body };
          }

          if (!response.ok) {
            throw new Error(result.error || `Deployment failed (${response.status}).`);
          }

          const link = document.createElement("a");
          link.href = result.url;
          link.textContent = result.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          status.replaceChildren(document.createTextNode("Your site is live: "), link);
          status.dataset.state = "success";
        } catch (error) {
          status.textContent = error.message || "Deployment failed. Please try again.";
          status.dataset.state = "error";
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
